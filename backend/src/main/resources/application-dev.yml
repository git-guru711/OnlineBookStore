# Dev profile (used by tests such as H2ConsoleIT; the app itself uses config/dev/application.yml).

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false   # only from this machine

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace   # also log bound parameter values
