# Complete dev configuration: with -Dspring.config.location=config/dev/ (DEV run configuration),
# Spring reads only this file, not src/main/resources/application*.yml.

spring:
  application:
    name: bookstore-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:bookstore;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate   # schema.sql owns the schema; startup fails if entities drift from it
    open-in-view: false

  sql:
    init:
      mode: always         # schema.sql and data.sql from src/main/resources

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  default-produces-media-type: application/json   # instead of */*
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

---
# dev profile only
spring:
  config:
    activate:
      on-profile: dev

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false   # only from this machine

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace   # also log bound parameter values
